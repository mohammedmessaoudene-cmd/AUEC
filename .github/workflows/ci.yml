name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=reference-runtime python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experimental/mcp-composition/tests -v
      - run: python -m compileall -q reference-runtime tests examples experimental/mcp-composition
