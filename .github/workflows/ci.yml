name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=reference-runtime python -m unittest discover -s tests -v
      - run: python -m unittest discover -s experimental/mcp-composition/tests -v
      - run: python -m compileall -q reference-runtime tests examples experimental/mcp-composition
      - run: python -B scripts/run_core_semantic_mutations.py --output "$RUNNER_TEMP/core-semantic-causal-controls"
      - run: python scripts/check_repository_hashes.py

  authority-delta-reviewer:
    name: Authority delta reviewer
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Replay all reviewer gates
        run: |
          $ErrorActionPreference = 'Stop'
          & ./experimental/mcp-composition/authority-delta-reviewer-v2_1/demo/run-review.ps1
          if ($LASTEXITCODE -ne 0) { throw "Reviewer failed: $LASTEXITCODE" }
      - name: Check regenerated evidence against tracked hashes
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/check_repository_hashes.py
          if ($LASTEXITCODE -ne 0) { throw "Evidence hash check failed: $LASTEXITCODE" }
