name: BV-AIC R1 Foundry CI

on:
  push:
    branches: [bv-aic-r1-ci-20260822]
  pull_request:
    branches: [main]
    paths:
      - "bv-aic-r1/**"
      - ".github/workflows/bv-aic-r1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry-r1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Foundry version
        run: forge --version

      - name: Compile
        working-directory: bv-aic-r1
        run: forge build --sizes

      - name: Directed and fuzz tests
        working-directory: bv-aic-r1
        run: forge test --match-contract BVAICAuthorityTest -vvv

      - name: Stateful invariants
        working-directory: bv-aic-r1
        run: forge test --match-contract BVAICInvariantTest -vvv

      - name: Full suite
        working-directory: bv-aic-r1
        run: forge test -vvv

      - name: Local EVM deployment smoke
        working-directory: bv-aic-r1
        run: ./scripts/anvil_deploy_smoke.sh

      - name: Format check
        working-directory: bv-aic-r1
        run: forge fmt --check

      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bv-aic-r1-runner-evidence
          path: |
            bv-aic-r1/reports/
            bv-aic-r1/out/
          if-no-files-found: ignore
