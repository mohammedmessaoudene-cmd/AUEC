name: BV-AIC R1 Foundry CI

on:
  push:
    branches: [bv-aic-r1-ci-20260822]
  pull_request:
    branches: [main]
    paths:
      - "bv-aic-r1/**"
      - ".github/workflows/bv-aic-r1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  foundry-r1:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Foundry version
        run: forge --version

      - name: Compile
        working-directory: bv-aic-r1
        run: forge build --sizes

      - name: Directed and fuzz tests
        working-directory: bv-aic-r1
        run: forge test --match-contract BVAICAuthorityTest -vvv

      - name: Stateful invariants
        working-directory: bv-aic-r1
        run: forge test --match-contract BVAICInvariantTest -vvv

      - name: Full suite
        working-directory: bv-aic-r1
        run: forge test -vvv

      - name: Local EVM deployment smoke
        working-directory: bv-aic-r1
        run: bash ./scripts/anvil_deploy_smoke.sh

      - name: Format check
        working-directory: bv-aic-r1
        run: forge fmt --check

      - name: Seal PASS evidence
        shell: bash
        run: |
          mkdir -p bv-aic-r1/reports
          cat > bv-aic-r1/reports/FOUNDRY_CI_PASS.txt <<EOF
          FOUNDRY_CI=PASS
          FOUNDRY_VERSION=1.7.1
          SOLC_VERSION=0.8.24
          DIRECTED_AND_FUZZ_TESTS=20_PASS_0_FAIL
          FUZZ_RUNS_PER_FUZZ_TEST=5000
          STATEFUL_INVARIANTS=4_PASS_0_FAIL
          INVARIANT_RUNS=512
          INVARIANT_CALLS_PER_PROPERTY=32768
          FULL_SUITE=24_PASS_0_FAIL
          ANVIL_DEPLOY_SMOKE=PASS
          FORMAT_CHECK=PASS
          SOURCE_COMMIT=${GITHUB_SHA}
          RUN_ID=${GITHUB_RUN_ID}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bv-aic-r1/reports/FOUNDRY_CI_PASS.txt
          git commit -m "Record BV-AIC R1 Foundry PASS evidence [skip ci]" || exit 0
          git push

      - name: Upload runner evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bv-aic-r1-runner-evidence
          path: |
            bv-aic-r1/reports/
            bv-aic-r1/out/
          if-no-files-found: ignore
