[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auec-gateway"
version = "0.36.0a1"
description = "Transport-neutral AUEC execution gateway for MCP, A2A, HTTP and browser adapters"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
auec-gateway = "aiew_gateway.server:main"

[tool.setuptools]
packages = ["aiew_gateway", "aiew_uc"]
